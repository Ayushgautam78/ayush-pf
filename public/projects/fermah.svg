<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="fermahCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFA3"/>
      <stop offset="50%" stop-color="#00E5BF"/>
      <stop offset="100%" stop-color="#00B4D8"/>
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Fermah Icon Glyph -->
  <g transform="translate(4, 10)" filter="url(#cyanGlow)">
    <!-- Top left pixel notch -->
    <rect x="0" y="0" width="8" height="6" rx="1.5" fill="url(#fermahCyanGrad)" />
    <!-- Top right pixel notch -->
    <rect x="28" y="0" width="8" height="6" rx="1.5" fill="url(#fermahCyanGrad)" />
    
    <!-- Top bridge bar -->
    <rect x="0" y="6" width="36" height="8" rx="2" fill="url(#fermahCyanGrad)" />
    
    <!-- Left vertical pillar -->
    <rect x="6" y="14" width="8" height="24" rx="2" fill="url(#fermahCyanGrad)" />
    
    <!-- Right vertical pillar -->
    <rect x="22" y="14" width="8" height="24" rx="2" fill="url(#fermahCyanGrad)" />
  </g>

  <!-- FERMAH Text -->
  <text x="56" y="38" font-family="'Space Grotesk', 'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="26" font-weight="800" letter-spacing="2.5" fill="#FFFFFF">
    FERMAH
  </text>
</svg>
